name: Bug report
description: Report a reproducible issue without exposing credentials or payment data
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [Local, Staging, Production, Unknown]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove tokens, card details, names and other sensitive data.
