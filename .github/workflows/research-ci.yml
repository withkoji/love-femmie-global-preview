name: Research Network CI
on:
  pull_request:
  push:
    branches: [main, feature/research-phase11-aws-staging]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate JavaScript syntax
        run: |
          node --check server.js
          node --check research-network/secure/auth.security.test.js
          node --check scripts/check-stripe-contract.js
          node --check scripts/check-stripe-contract.test.js
          node --check scripts/verify-research-schema.js
          node --check scripts/verify-research-schema.test.js
          node --check scripts/check-research-staging.js
          node --check scripts/check-research-staging.test.js
          node --check research-network/secure/auth.js
          node --check research-network/secure/router.js
          node --check research-network/secure/router.integration.test.js
          node --check public/research-client.js
          node --check public/research-network-secure.js
          node --check public/research-admin-secure.js
      - name: Run research tests
        run: npm run test:research
      - name: Test staging preflight guard
        run: npm run test:staging
      - name: Verify research schema contract
        run: npm run test:schema
      - name: Verify authentication and Stripe contract guards
        run: npm run test:security
      - name: Verify AWS staging configuration guard
        run: npm run test:aws-staging
      - name: Verify AWS staging region
        run: npm run test:aws-region
      - name: Verify production deployment guard
        run: node scripts/check-research-readiness.js
