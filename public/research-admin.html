<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research Management | LOVE FEMMIE</title><style>body{margin:0;background:#f8faf6;color:#244b37;font:16px/1.5 system-ui}header{background:#24563e;color:white;padding:20px}main{max-width:1000px;margin:auto;padding:30px}section{background:white;border:1px solid #d6e6d8;border-radius:18px;padding:24px;margin:24px 0}label{display:block;margin:14px 0}input,textarea,select{display:block;width:100%;max-width:700px;padding:10px;border:1px solid #9aaf9f;border-radius:8px}textarea{min-height:90px}button{margin:8px 8px 8px 0;padding:10px 16px;background:#24563e;color:white;border:0;border-radius:22px;cursor:pointer}article{padding:16px 0;border-bottom:1px solid #e1e7e0}a{color:#24563e}</style></head><body><header>LOVE FEMMIE GLOBAL · Research Management</header><main><h1>Editorial research dashboard</h1><p>Development preview. Production admin access is disabled until verified staff authentication is connected.</p><section><h2>Import a research source</h2><form id="import"><label>Headline<input name="title" required maxlength="250"></label><label>Publisher<input name="source" required maxlength="150"></label><label>Original URL<input name="url" type="url" required></label><label>Topic<select id="topic" name="topic"></select></label><button type="submit">Create draft</button></form></section><section><h2>Review queue</h2><button id="refresh" type="button">Refresh</button><div id="queue" aria-live="polite"></div></section></main><script src="/research-admin.js" defer></script></body></html>
