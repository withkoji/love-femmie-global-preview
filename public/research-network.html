<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Research + Network | LOVE FEMMIE</title><style>body{font:16px/1.5 system-ui;background:#f7faf5;color:#254432;margin:0}header{background:#285b41;color:white;padding:20px}main{max-width:950px;margin:auto;padding:30px}section{background:white;border:1px solid #d7e5d7;border-radius:18px;margin:24px 0;padding:24px}.chips{display:flex;flex-wrap:wrap;gap:12px}label{display:block;margin:10px 0}button{background:#285b41;color:white;border:0;border-radius:20px;padding:12px 20px;cursor:pointer}a{color:#285b41}article{border-bottom:1px solid #ddd;padding:14px 0}</style></head><body><header>LOVE FEMMIE GLOBAL · Research + Network</header><main><h1>Explore research. Find your community.</h1><p>Development preview. Research appears only after editorial approval. Matching uses consent-based demonstration profiles.</p><section><h2>Research topics</h2><div id="topics" class="chips">Loading…</div></section><section><h2>Published research</h2><div id="news">Loading…</div></section><section><h2>Shared-interest connections</h2><form id="form"><div id="interests" class="chips"></div><label><input id="consent" type="checkbox" required> I agree to interest-based matching for this demonstration.</label><button>Find matches</button></form><div id="matches" aria-live="polite"></div></section></main><script>
const base='/api/research-network';const el=id=>document.getElementById(id);const add=(parent,tag,text)=>{const x=document.createElement(tag);x.textContent=text;parent.append(x);return x};
(async()=>{try{const t=await(await fetch(base+'/topics')).json();el('topics').replaceChildren();for(const name of t.topics){add(el('topics'),'span',name);const label=document.createElement('label'),input=document.createElement('input');input.type='checkbox';input.name='interest';input.value=name;label.append(input,document.createTextNode(name));el('interests').append(label)}const n=await(await fetch(base+'/news')).json();el('news').replaceChildren();if(!n.items.length)add(el('news'),'p','No research has been approved yet.');for(const item of n.items){const a=add(el('news'),'article',item.title+' — '+item.source+' — '+(item.summary||''));const link=add(a,'a','Read original publisher');link.href=item.sourceUrl;link.rel='noopener noreferrer';link.target='_blank'}}catch{el('topics').textContent='Service not connected';el('news').textContent='Research API unavailable';}})();
el('form').onsubmit=async e=>{e.preventDefault();const interests=[...document.querySelectorAll('input[name=interest]:checked')].map(x=>x.value);try{const r=await fetch(base+'/matches',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({viewer:{id:'preview-member',matchingConsent:el('consent').checked,interests}})});const d=await r.json();el('matches').replaceChildren();if(!d.matches.length)add(el('matches'),'p','No matches found.');for(const m of d.matches)add(el('matches'),'p',m.displayName+' · Shared interests: '+m.sharedInterests.join(', '));}catch{el('matches').textContent='Matching service unavailable';}};
</script></body></html>
